<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Get in touch with the Aura Leather Co. atelier."><title>Contact the Atelier — Aura Leather Co.</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/main.js"></script></head>
<body data-page="contact"><div id="site-header"></div><main class="page-main contact-main"><section class="page-intro"><p class="eyebrow">A note to the atelier</p><h1>We’re here to help.</h1><p>Questions about care, fit, a gift or an order? Our small team would love to hear from you.</p></section><div class="contact-layout"><div class="contact-card"><p class="eyebrow">Customer care</p><h2>Good conversation, no rush.</h2><p>Write to <a class="text-link" href="mailto:atelier@auraleather.co">atelier@auraleather.co</a></p><p>Monday–Friday<br>9:00 am–5:00 pm (ET)</p><p class="muted-note">We usually reply within one business day.</p></div><form id="contact-form" class="form-card"><label>Your name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>How can we help?<textarea name="message" minlength="10" maxlength="1200" required></textarea></label><button class="button button-dark" type="submit">Prepare an email</button><p class="form-message" aria-live="polite"></p></form></div></main><div id="site-footer"></div></body></html>
