<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Sign in or create your Aura Leather Co. account."><title>Your Account — Aura Leather Co.</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/main.js"></script><script defer src="/js/auth.js"></script></head>
<body data-page="account"><div id="site-header"></div><main class="page-main narrow-main account-main"><section class="page-intro page-intro-compact"><p class="eyebrow">Your Aura account</p><h1>A little closer to the atelier.</h1><p>Keep your details close and find every order in one place.</p></section><div id="account-root"><div class="auth-grid"><form id="login-form" class="form-card"><p class="eyebrow">Welcome back</p><h2>Sign in</h2><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button button-dark" type="submit">Sign in</button><p class="form-message" aria-live="polite"></p><p class="form-footnote">Admin demo: <code>admin@auraleather.test</code> / <code>AtelierAdmin26!</code></p></form><form id="register-form" class="form-card"><p class="eyebrow">Begin a collection</p><h2>Create an account</h2><label>Full name<input name="name" autocomplete="name" minlength="2" maxlength="70" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><button class="button button-outline" type="submit">Create your account</button><p class="form-message" aria-live="polite"></p></form></div></div></main><div id="site-footer"></div></body></html>
